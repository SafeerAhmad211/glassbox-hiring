name: atlas refresh

on:
  schedule:
    - cron: "0 6 * * 1"   # weekly, Mondays 06:00 UTC
  workflow_dispatch:

permissions:
  contents: write

jobs:
  refresh:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - run: pip install -e ".[scrape]"

      - name: Check regulation sources
        run: python -m glassbox.atlas.scraper

      - name: Commit any change
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add data/vendors.json src/glassbox/atlas/vendors.json || true
          git diff --cached --quiet || git commit -m "chore: refresh atlas source checks"
          git push
